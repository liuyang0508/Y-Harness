[package]
name = "y-harness-aquaculture"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Aquaculture Domain Pack and embedding-host contracts for Y-Harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liuyang0508/Y-Harness"
publish = false

[dependencies]
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
y-harness = { path = "../..", default-features = false }
y-harness-domain-pack = { path = "../../control/domain-pack" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

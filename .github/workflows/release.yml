name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate immutable release coordinate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Select minimum Rust toolchain
        run: rustup default 1.88.0
      - name: Verify tag, package, TUI, notes, and commit
        run: ./scripts/verify-release-coordinate.sh "$GITHUB_REF_NAME"
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Zero-default workspace tests
        run: cargo test --locked --workspace --all-targets --no-default-features
      - name: All-feature workspace tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Full-screen TUI pseudo-terminal smoke
        run: |
          cargo build --locked --bin yh -p y-harness
          cargo build --locked --bin yh-tui -p y-harness-tui
          python3 scripts/smoke-tui.py
          python3 scripts/smoke-tui.py --configured
      - name: Harness regression evaluation
        run: cargo run --locked -- eval-smoke
      - name: Public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: Publishable Core crate archive
        run: cargo package --locked -p y-harness
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --deny warnings
      - name: Calibrated State performance smoke
        env:
          YH_BENCH_EVENTS: "1000"
          YH_BENCH_SAMPLES: "5"
          YH_BENCH_MAX_APPEND_MS: "350"
          YH_BENCH_MAX_PROJECT_MS: "15"
          YH_BENCH_MAX_FORK_MS: "50"
          YH_BENCH_MAX_ARCHIVE_EXPORT_MS: "50"
          YH_BENCH_MAX_ARCHIVE_IMPORT_MS: "50"
          YH_BENCH_MAX_THREAD_LIST_MS: "50"
          YH_BENCH_MAX_SNAPSHOT_LOAD_MS: "15"
        run: cargo run --locked --release --bin yh-state-bench

  unix-binaries:
    name: Build and test on ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test exact source
        run: cargo +1.88.0 test --locked --workspace --all-targets --all-features
      - name: Build release binaries
        run: |
          cargo +1.88.0 build --locked --release --all-features --bin yh -p y-harness
          cargo +1.88.0 build --locked --release --bin yh-tui -p y-harness-tui
      - name: Package binaries
        run: |
          host="$(rustc +1.88.0 -vV | sed -n 's/^host: //p')"
          engine_archive="y-harness-${GITHUB_REF_NAME}-${host}.tar.gz"
          tui_archive="y-harness-tui-${GITHUB_REF_NAME}-${host}.tar.gz"
          mkdir -p dist/engine dist/tui
          cp target/release/yh README.md LICENSE-MIT LICENSE-APACHE dist/engine/
          cp target/release/yh-tui clients/tui/README.md LICENSE-MIT LICENSE-APACHE dist/tui/
          tar -C dist/engine -czf "dist/${engine_archive}" .
          tar -C dist/tui -czf "dist/${tui_archive}" .
      - name: Stage immutable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-binary:
    name: Build and test on windows-latest
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test exact source
        run: cargo +1.88.0 test --locked --workspace --all-targets --all-features
      - name: Build release binaries
        run: |
          cargo +1.88.0 build --locked --release --all-features --bin yh -p y-harness
          cargo +1.88.0 build --locked --release --bin yh-tui -p y-harness-tui
      - name: Package binaries
        shell: pwsh
        run: |
          $hostTriple = ((rustc +1.88.0 -vV | Select-String '^host: ').Line -replace '^host: ', '')
          $engineArchive = "y-harness-$env:GITHUB_REF_NAME-$hostTriple.zip"
          $tuiArchive = "y-harness-tui-$env:GITHUB_REF_NAME-$hostTriple.zip"
          New-Item -ItemType Directory -Force dist/engine, dist/tui | Out-Null
          Copy-Item target/release/yh.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/engine/
          Copy-Item target/release/yh-tui.exe, clients/tui/README.md, LICENSE-MIT, LICENSE-APACHE dist/tui/
          Compress-Archive -Path dist/engine/* -DestinationPath "dist/$engineArchive"
          Compress-Archive -Path dist/tui/* -DestinationPath "dist/$tuiArchive"
      - name: Stage immutable artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-latest
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  sbom:
    name: Generate CycloneDX workspace SBOM
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install pinned CycloneDX generator
        run: cargo +1.88.0 install cargo-cyclonedx --locked --version 0.5.9
      - name: Generate and package workspace SBOMs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 cyclonedx \
            --format json \
            --all-features \
            --target all \
            --spec-version 1.5 \
            --license-strict
          expected_count="$(cargo +1.88.0 metadata --locked --format-version 1 --no-deps | \
            python3 -c 'import json, sys; print(len(json.load(sys.stdin)["workspace_members"]))')"
          actual_count="$(find . -path ./target -prune -o -type f -name '*.cdx.json' -print | wc -l | tr -d ' ')"
          if [ "$actual_count" != "$expected_count" ]; then
            echo "expected $expected_count workspace SBOMs, found $actual_count" >&2
            exit 1
          fi
          mkdir -p dist
          find . -path ./target -prune -o -type f -name '*.cdx.json' -print0 | \
            sort -z | \
            tar --null -T - -czf "dist/y-harness-${GITHUB_REF_NAME}-sbom.cdx.tar.gz"
      - name: Stage immutable SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: dist/*-sbom.cdx.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attest and publish complete release
    needs:
      - unix-binaries
      - windows-binary
      - sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every staged artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create complete SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 7
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
              sort -z | \
              xargs -0 sha256sum
          ) >dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attest released artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Publish release only after every gate succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_path="docs/release-notes-${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists and will not be mutated: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Y-Harness $GITHUB_REF_NAME" \
            --notes-file "$notes_path"

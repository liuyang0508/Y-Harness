name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust 1.88 quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: Select minimum Rust toolchain
        run: rustup default 1.88.0
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Production panic boundary
        run: |
          cargo clippy --locked -p y-harness --lib --all-features -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D warnings
          cargo clippy --locked -p y-harness-tui --bin yh-tui -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D warnings
          cargo clippy --locked -p y-harness-domain-pack --lib -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D warnings
          cargo clippy --locked -p y-harness-benchmark-runner --bin yh-bench -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D warnings
          cargo clippy --locked -p y-harness-fault-fixture --bin yh-fault-fixture -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D warnings
      - name: Minimal surface tests
        run: cargo test --locked --workspace --all-targets --no-default-features
      - name: Isolated optional-feature checks
        run: |
          cargo check --locked --no-default-features --features https-model
          cargo check --locked --no-default-features --features https-mcp
          cargo check --locked --no-default-features --features https-skill
          cargo check --locked --no-default-features --features http-probe
          cargo check --locked --no-default-features --features tls-host
      - name: All-feature tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Full-screen TUI pseudo-terminal smoke
        run: |
          cargo build --locked --bin yh -p y-harness
          cargo build --locked --bin yh-tui -p y-harness-tui
          python3 scripts/smoke-tui.py
          python3 scripts/smoke-tui.py --configured
      - name: Public API embedding
        run: |
          cargo run --locked --example embedded
          cargo run --locked --example orchestrated
          cargo run --locked --example temporal_driver
          cargo run --locked --example effect_executor
          cargo run --locked --example effect_reconciler
          cargo run --locked --example json_effect_connector
      - name: Harness regression evaluation
        run: cargo run --locked -- eval-smoke
      - name: Public documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features
      - name: Publishable crate archive
        run: cargo package --locked -p y-harness

  portability:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select minimum Rust toolchain
        run: rustup default 1.88.0
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features

  security-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  performance-smoke:
    name: SQLite State performance smoke gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Select minimum Rust toolchain
        run: rustup default 1.88.0
      - name: Run calibrated smoke workload
        env:
          YH_BENCH_EVENTS: "1000"
          YH_BENCH_SAMPLES: "5"
          # Shared-runner medians measured 2026-08-03..2026-08-10: append
          # 515 ms, project 15.6 ms, fork 49 ms, archive export 27 ms /
          # import 36 ms, snapshot load 18.7 ms. Bounds are >=2x measured and
          # only catch catastrophic regressions; docs/performance-baseline.md
          # keeps the calibrated local numbers.
          YH_BENCH_MAX_APPEND_MS: "1000"
          YH_BENCH_MAX_PROJECT_MS: "40"
          YH_BENCH_MAX_FORK_MS: "100"
          YH_BENCH_MAX_ARCHIVE_EXPORT_MS: "80"
          YH_BENCH_MAX_ARCHIVE_IMPORT_MS: "80"
          YH_BENCH_MAX_THREAD_LIST_MS: "50"
          YH_BENCH_MAX_SNAPSHOT_LOAD_MS: "40"
        run: cargo run --locked --release --bin yh-state-bench

[package]
name = "y-harness-domain-pack"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Optional governed Domain Pack control plane for Y-Harness"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liuyang0508/Y-Harness"
publish = false

[dependencies]
rusqlite = { version = "=0.39.0", features = ["bundled"] }
semver = { version = "=1.0.28", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
y-harness = { path = "../..", default-features = false }

[lints.rust]
unsafe_code = "forbid"

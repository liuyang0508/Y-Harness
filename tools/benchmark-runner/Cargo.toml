[package]
name = "y-harness-benchmark-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "yh-bench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
y-harness = { path = "../..", default-features = false }

[lints.rust]
unsafe_code = "forbid"
